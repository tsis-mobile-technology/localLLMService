services:
  postgres:
    image: postgres:16-alpine
    container_name: litellm-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-litellm}
      POSTGRES_USER: ${POSTGRES_USER:-llm_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-llm_secret_pass}
      TZ: "Asia/Seoul"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_restore.sh:/docker-entrypoint-initdb.d/01_restore.sh:ro
      - ./init_db.sql:/docker-entrypoint-initdb.d/02_init_db.sql:ro
      - ./backups:/backups

    networks:
      - local-llm-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-llm_admin} -d ${POSTGRES_DB:-litellm}"]
      interval: 3s
      timeout: 3s
      retries: 10

  laya:
    image: local-laya:latest
    build:
      context: .
      dockerfile: Dockerfile.laya
    container_name: laya-engine
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      LAYA_DEVICE: ${LAYA_DEVICE:-auto}
      LAYA_PRELOAD: 1
      LAYA_MODELS: "multilingual,english"
      HF_HOME: /root/.cache/huggingface
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
    networks:
      - local-llm-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

networks:
  local-llm-net:
    name: local-llm-net
    driver: bridge

volumes:
  postgres_data:
    name: local_llm_postgres_data
